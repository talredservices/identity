packages:
  - layers/auth
  - layers/admin
  - packages/i18n
  - packages/ui

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - ws@8.20.1 || 8.21.0
  - brace-expansion@5.0.6 || 5.0.7 || 5.0.8 || 5.0.9
  - esbuild@0.28.1
  - postcss@8.5.18 || 8.5.23
  - socket.io-parser@4.2.7
  - undici@6.28.0
  - js-yaml@4.3.2
  - nanoid@3.3.16 || 3.3.18

overrides:
  '@nuxtjs/mdc': ^0.22.1
  '@bomb.sh/tab@<0.0.22': ^0.0.22
  '@tiptap/core': ^3.30.4
  '@tiptap/suggestion': 3.22.4
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  socket.io-parser@>=4.0.0 <4.2.7: ^4.2.7
  undici@>=6.0.0 <6.28.1: ^6.28.1
  undici@>=8.0.0 <8.10.2: ^8.10.2
  ws@>=8.0.0 <8.20.1: ^8.20.1
  ws@>=8.0.0 <8.21.0: ^8.21.0

  # Security floors for transitive packages (see docs/ci-failure-prevention.md).
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  devalue@>=5.0.0 <5.9.3: ^5.9.3
  simple-git@>=3.15.0 <4.0.1: ^4.0.1
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  postcss-selector-parser@>=7.0.0 <7.1.6: ^7.1.6
  prosemirror-view@<1.42.3: ^1.42.3
  '@vue/server-renderer@<3.5.42': ^3.5.43
  'vue@>=3.0.0 <3.5.43': ^3.5.43
  '@tiptap/pm': ^3.31.2

patchedDependencies:
  'nuxt@4.6.0': patches/nuxt-preserve-document-scope.patch
  '@nuxt/devtools@3.4.2': patches/nuxt-devtools-simple-git.patch
