name: Container images

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: identity-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ci:
    uses: ./.github/workflows/ci.yml
  verify-security:
    uses: ./.github/workflows/security.yml
  publish:
    needs: [verify-ci, verify-security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: identity-server
            dockerfile: docker/identity-server/Dockerfile
          - image: identity-nginx
            dockerfile: docker/identity-server/nginx.Dockerfile
          - image: identity-console
            dockerfile: docker/identity-console/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
