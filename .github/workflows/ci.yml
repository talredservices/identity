name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    name: Nuxt console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUXT_SESSION_PASSWORD: ci-only-session-password-with-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Run shared frontend gate
        run: CI_RUNTIME=host ./scripts/ci frontend

      - name: Build
        run: CI_RUNTIME=host ./scripts/ci build

  api:
    name: Laravel API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Run shared Laravel gate
        run: CI_RUNTIME=host ./scripts/ci backend

  production-images:
    name: Build ${{ matrix.image }} without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: identity-server
            dockerfile: docker/identity-server/Dockerfile
          - image: identity-nginx
            dockerfile: docker/identity-server/nginx.Dockerfile
          - image: identity-console
            dockerfile: docker/identity-console/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: CI_RUNTIME=host ./scripts/ci image "${{ matrix.dockerfile }}"
